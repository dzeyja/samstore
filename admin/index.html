<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMSTORE.KZ — Админка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--muted:#86868b;--line:#ebebed;--tile:#f5f5f7;--ok:#1a9d4b;--warn:#d98200;--font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.4;padding:env(safe-area-inset-top,0) 0 calc(40px + env(safe-area-inset-bottom,0))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.brand{font-size:18px;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:10px}.lg img{width:40px;height:40px;border-radius:50%;display:block}
.link{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap}
.link:hover{color:var(--ink)}
.seg{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:6px 0;min-height:40px;font-size:14px;font-weight:600;border-radius:0;flex:none}
.seg button.on{color:var(--ink);border-color:var(--ink)}
.admin{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.m{background:var(--tile);border-radius:14px;padding:14px}
.m b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:500;font-size:12px}tr:last-child td{border:0}
.pill{border:1px solid currentColor;background:none;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.new{animation:tick .5s}
@keyframes tick{from{opacity:.3;transform:translateY(4px)}}
.ad-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:0 16px;min-height:40px;font-weight:600;font-size:13px}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:none;color:#c62828;border:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--tile)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px}
.mini{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--tile);display:block}
.pl{display:grid;grid-template-columns:84px 96px 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.pl input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.pl.h{font-size:12px;color:var(--muted)}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.back.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 0;display:flex;flex-direction:column;gap:18px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(min-width:600px){.back{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h3{font-size:20px;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--tile);font-size:14px;flex:none}
.cta{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0))}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;display:none}
.toast.on{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="tw"><table><thead><tr><th></th><th>Название</th><th>Цена</th><th>Наличие</th><th></th></tr></thead><tbody>${P.map(p=>`<tr style="${p.hide?"opacity:.5":""}"><td>${p.imgs[0]?`<img class="mini" src="${p.imgs[0]}" alt="">`:`<div class="mini"></div>`}</td><td><b>${esc(p.name)}</b><div class="sub">${esc(p.cat)} · фото: ${p.imgs.length}</div></td><td>$${p.base}${p.old>p.base?` <s class="sub">$${p.old}</s>`:""}<div class="sub">${fmt(kzt(p.base))}</div></td><td>${ST[p.st][0]}</td><td><button class="btn o" onclick="openEd(${p.id})">Изменить</button> <button class="btn o" onclick="mv(${p.id},-1)" aria-label="Выше">↑</button><button class="btn o" onclick="mv(${p.id},1)" aria-label="Ниже">↓</button><button class="btn o" onclick="hid(${p.id})">${p.hide?"Показать":"Скрыть"}</button></td></tr>`).join("")}</tbody></table></div>`}
function aL(){return `<div class="sub">Платёж = цена × (1 + наценка%) ÷ срок. Наценка 0 даёт рассрочку без переплаты (например, 0·0·24: 24 мес, 0%). Метка показывается под сроком.</div>
  <div><div class="pl h"><span>Срок, мес</span><span>Наценка, %</span><span>Метка</span><span></span></div>${PLANS.map((x,i)=>`<div class="pl"><input type="number" min="1" value="${x.m}" onchange="PLANS[${i}].m=Math.max(1,+this.value||1);save()" aria-label="Срок"><input type="number" min="0" step="0.5" value="${x.pct}" onchange="PLANS[${i}].pct=Math.max(0,+this.value||0);save()" aria-label="Наценка"><input value="${esc(x.label)}" placeholder="например, 0·0·24" onchange="PLANS[${i}].label=this.value.trim();save()" aria-label="Метка"><button class="btn d" style="padding:0" ${PLANS.length<2?"disabled":""} onclick="PLANS.splice(${i},1);save();admin()" aria-label="Удалить">✕</button></div>`).join("")}</div>
  <div><button class="btn" onclick="PLANS.push({id:Date.now(),m:12,pct:0,label:''});save();admin()">+ Добавить условие</button></div>`}
function aR(){const nx=hs(Date.now())+36e5;return `<div class="sub">Цены в каталоге пересчитываются раз в час. Биржевой курс подставится в каталог в ${tm(nx)}, либо сразу по кнопке.</div>
  <div class="rf"><div class="fld"><label>Биржевой курс, ₸/$</label><input type="number" value="${raw}" onchange="raw=+this.value||raw;save();admin()"></div><div class="fld"><label>Коридор: минимум</label><input type="number" value="${MIN}" onchange="MIN=+this.value||MIN;save();admin()"></div><div class="fld"><label>Коридор: максимум</label><input type="number" value="${MAX}" onchange="MAX=+this.value||MAX;save();admin()"></div></div>
  <div class="m"><span class="sub">Сейчас в каталоге</span><b>${RATE} ₸/$</b><div class="sub">обновлён в ${tm(lastA)}${clamp(raw)!==raw?" · биржа вне коридора, применится "+clamp(raw)+" ₸":""}</div></div>
  <div><button class="btn" onclick="applyRate()">Применить сейчас</button></div>`}
function mv(id,d){const c=P.find(p=>p.id===id).cat,ix=P.map((p,i)=>p.cat===c?i:-1).filter(i=>i>=0),k=ix.findIndex(i=>P[i].id===id),j=k+d;if(j<0||j>=ix.length)return;[P[ix[k]],P[ix[j]]]=[P[ix[j]],P[ix[k]]];save();admin()}
function hid(id){const p=P.find(p=>p.id===id);p.hide=!p.hide;save();admin()}
function aC(){const c=cats();return `<div class="sub">Порядок категорий на витрине.</div><div class="tw"><table><tbody>${c.map((n,i)=>`<tr><td><b>${esc(n)}</b><div class="sub">товаров: ${P.filter(p=>p.cat===n).length}</div></td><td style="text-align:right"><button class="btn o" ${i?"":"disabled"} onclick="mvC(${i},-1)">↑</button> <button class="btn o" ${i<c.length-1?"":"disabled"} onclick="mvC(${i},1)">↓</button></td></tr>`).join("")}</tbody></table></div>`}
function mvC(i,d){const c=cats(),j=i+d;[c[i],c[j]]=[c[j],c[i]];ORDER=c;save();admin()}
function aX(){const w=ORD.filter(o=>!o.t||Date.now()-o.t<6048e5).length,top={};ORD.forEach(o=>{const n=o.item.split(" (")[0];top[n]=(top[n]||0)+1});
  const t=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>esc(x[0])+" · "+x[1]).join("<br>")||"—";
  return `<div class="metrics"><div class="m"><span class="sub">Броней за 7 дней</span><b>${w}</b></div><div class="m"><span class="sub">Популярные товары</span><div style="font-size:13px;margin-top:4px">${t}</div></div></div><div><button class="btn o" onclick="csv()">Экспорт в CSV</button></div>`}
function dl(n,x,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';dl("orders.csv","\ufeff"+["Товар;Клиент;Условия;Сумма;Статус;Дата"].concat(ORD.map(o=>[o.item,o.who,o.terms,o.sum,SN[o.s],o.t?new Date(o.t).toLocaleString("ru-RU"):""].map(q).join(";"))).join("\n"),"text/csv")}
const bk=()=>dl("samstore-backup.json",JSON.stringify({P,PLANS,ORD,MIN,MAX,raw,RATE,lastA,CFG,ORDER}),"application/json");
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{if(!JSON.parse(r.result).P)throw 0;localStorage.setItem(KEY,r.result);location.reload()}catch(e){toast("Неверный файл")}};r.readAsText(f)}
function rst(b){if(!b.dataset.s){b.dataset.s=1;b.textContent="Точно сбросить?";return}localStorage.removeItem(KEY);location.reload()}
const cf=(k,l,t)=>`<div class="fld"><label>${l}</label><input ${t?'type="number" min="1"':""} value="${esc(CFG[k])}" onchange="CFG.${k}=${t?"+this.value||1":"this.value.trim()"};save()"></div>`;
function aS(){return `<div class="rf">${cf("addr","Адрес")}${cf("hours","Часы работы")}${cf("phone","WhatsApp (цифры, без +)")}</div>
  <div class="rf">${cf("hold","Время брони, минут",1)}</div>
  <div class="fld"><label>Сообщение в WhatsApp. Переменные: {товар} {цена} {условия} {время}</label><textarea onchange="CFG.tpl=this.value;save()">${esc(CFG.tpl)}</textarea></div>
  <div class="fld"><label>Баннер на витрине (акция)</label><input value="${esc(CFG.banner)}" onchange="CFG.banner=this.value.trim();save()"></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" ${CFG.bannerOn?"checked":""} onchange="CFG.bannerOn=this.checked;save()"> Показывать баннер</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o" onclick="bk()">Скачать бэкап JSON</button><label class="btn o" style="display:inline-flex;align-items:center;cursor:pointer">Загрузить бэкап<input type="file" accept=".json" hidden onchange="rs(this)"></label><button class="btn d" onclick="rst(this)">Сбросить демо</button></div>`}
function openEd(id){ed=id?P.find(p=>p.id===id):{id:0,cat:"MacBook",name:"",base:0,st:"in",v:[],c:[],imgs:[]};edI=[...ed.imgs];
  $("edB").innerHTML=`<div class="sh"><h3>${id?"Изменить товар":"Новый товар"}</h3><button class="x" onclick="closeEd()" aria-label="Закрыть">✕</button></div>
  <div class="fld"><label>Название</label><input id="e1"></div>
  <div class="fld"><label>Категория</label><input id="e2" list="cl"><datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
  <div class="rf"><div class="fld"><label>Цена, $</label><input id="e3" type="number" min="0"></div><div class="fld"><label>Наличие</label><select id="e4">${Object.keys(ST).map(k=>`<option value="${k}" ${ed.st===k?"selected":""}>${ST[k][1]}</option>`).join("")}</select></div></div>
  <div class="fld"><label>Старая цена, $ (для скидки, необязательно)</label><input id="e7" type="number" min="0"></div>
  <div class="fld"><label>Конфигурации: по строке «название | доплата в $»</label><textarea id="e5"></textarea></div>
  <div class="fld"><label>Цвета: по строке «название | #цвет»</label><textarea id="e6"></textarea></div>
  <div class="fld"><label>Фото (первое показывается в каталоге первым)</label><div class="thumbs" id="edP"></div><input type="file" accept="image/*" multiple onchange="addImgs(this)"></div>
  <div class="cta" style="display:flex;gap:8px"><button class="btn" style="flex:1;min-height:48px" onclick="saveEd()">Сохранить</button>${id?`<button class="btn d" onclick="delEd(this)">Удалить</button>`:""}</div>`;
  $("e1").value=ed.name;$("e7").value=ed.old||"";$("e2").value=ed.cat;$("e3").value=ed.base||"";$("e5").value=ed.v.map(v=>v[0]+" | "+v[1]).join("\n");$("e6").value=ed.c.map(c=>c.n+" | "+c.c).join("\n");
  edT();$("ed").classList.add("open");document.body.style.overflow="hidden"}
function closeEd(){$("ed").classList.remove("open");document.body.style.overflow=""}
function edT(){$("edP").innerHTML=edI.map((u,i)=>`<div class="th"><img src="${u}" alt=""><button onclick="edI.splice(${i},1);edT()" aria-label="Убрать фото">✕</button></div>`).join("")}
function addImgs(inp){[...inp.files].forEach(file=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);edI.push(c.toDataURL("image/jpeg",.72));edT()};im.src=r.result};r.readAsDataURL(file)});inp.value=""}
const lines=id=>$(id).value.split("\n").map(l=>l.trim()).filter(Boolean);
function saveEd(){const name=$("e1").value.trim();if(!name){$("e1").focus();return}
  const v=lines("e5").map(l=>{const[a,b]=l.split("|");return[a.trim(),+(b||0)||0]}).filter(x=>x[0]);
  const c=lines("e6").map(l=>{const[a,b]=l.split("|");return{n:a.trim(),c:hex((b||"").trim())}}).filter(x=>x.n);
  const o={id:ed.id||Math.max(0,...P.map(p=>p.id))+1,cat:$("e2").value.trim()||"Другое",name,base:+$("e3").value||0,st:$("e4").value,v:v.length?v:[["Стандарт",0]],c:c.length?c:[col("Стандарт","#cccccc")],imgs:edI,old:+$("e7").value||0,hide:!!ed.hide};
  const i=P.findIndex(p=>p.id===o.id);i<0?P.push(o):P[i]=o;save();closeEd();admin();toast("Товар сохранён")}
function delEd(b){if(!b.dataset.s){b.dataset.s=1;b.textContent="Точно удалить?";return}
  P=P.filter(p=>p.id!==ed.id);save();closeEd();admin()}
addEventListener("keydown",e=>{if(e.key==="Escape")closeEd()});
admin();
</script>
</body>
</html>
