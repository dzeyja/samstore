<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMSTORE.KZ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--muted:#86868b;--line:#ebebed;--tile:#f5f5f7;--card:#fff;--accent:#111;--ok:#1a9d4b;--warn:#d98200;--off:#b0b0b5;--font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:100px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.4;padding:env(safe-area-inset-top,0) 0 120px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:800;letter-spacing:-.03em}.brand span{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.rate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.head-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.contacts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.contacts b{font-size:12px;font-weight:600}.contacts span{font-size:11px;color:var(--muted)}
.write{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.seg{display:flex;gap:22px}
.seg button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:6px 0;min-height:40px;font-size:14px;font-weight:600;border-radius:0}
.seg button.on{color:var(--ink);border-color:var(--ink)}
.search{width:100%;min-height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--tile);color:var(--ink);font:inherit;font-size:15px;margin:18px 0 10px}
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--tile);color:var(--muted);padding:0 16px;min-height:36px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.chip.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}.chip small{display:none}
.chip.tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cmp div{background:var(--bg);border-radius:10px;padding:10px 8px;text-align:center}
.cmp span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.cmp b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.cmp .hi{color:var(--ok)}
@media(max-width:540px){.contacts{align-items:flex-start;text-align:left}.head-r{width:100%;justify-content:space-between}}
.sec{margin-bottom:32px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.all{border:0;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:6px 0}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:200px;scroll-snap-align:start}
@media(max-width:540px){.rail .card{width:156px}}
.rail.wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px 14px;overflow:visible;margin:0;padding:0}
.rail.wrap .card{width:auto}
@media(max-width:540px){.rail.wrap{grid-template-columns:repeat(2,1fr);gap:18px 12px}}
.rw{position:relative}
.ar{display:none;position:absolute;top:36%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;place-items:center;z-index:5}
.ar.l{left:-10px}.ar.r{right:-10px}.ar[hidden]{display:none!important}
@media(hover:hover) and (min-width:700px){.ar{display:grid}}
.card{background:none;border:0;padding:0;display:flex;flex-direction:column;text-align:left}
.tile{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--tile);color:var(--muted);margin-bottom:10px}
.tile svg{width:38%;height:auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:3px}
.st i{width:6px;height:6px;border-radius:50%;background:var(--off)}
.s-in i{background:var(--ok)}.s-st i{background:var(--warn)}.s-so i{background:var(--off)}
.name{font-size:14px;font-weight:600;margin-bottom:6px}
.cols{display:flex;gap:4px;margin-bottom:8px}
.sw{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.pbox{margin-top:auto}
.mo{font-size:16px;font-weight:700;letter-spacing:-.02em}
.mo small{font-size:12px;font-weight:500;color:var(--muted)}
.cash{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.back.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px 0;display:flex;flex-direction:column;gap:18px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(min-width:600px){.back{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh h3{font-size:20px;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--tile);font-size:14px;flex:none}
.lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.calc{background:var(--tile);border-radius:14px;padding:14px}
.calc .seg{gap:2px;background:var(--bg);padding:3px;border-radius:10px}
.calc .seg button{border:0;border-radius:8px;min-height:36px;color:var(--muted)}
.calc .seg button.on{background:var(--ink);color:var(--bg)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.months .opt{flex-direction:column;gap:0;justify-content:center;padding:4px;min-height:48px;line-height:1.2}
.months small{font-size:10px;font-weight:400;color:var(--muted)}
.big{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big.tick{animation:tick .3s}
@keyframes tick{from{opacity:.3;transform:translateY(4px)}}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.cta{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0))}
.wa{width:100%;min-height:52px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600}
.cta .note{text-align:center;margin:8px 0 0}
.bar{position:fixed;left:16px;right:70px;bottom:calc(16px + env(safe-area-inset-bottom,0));max-width:400px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:70;font-size:13px}
.bar.on{display:flex}.bar b{display:block;font-size:13px}.bar span{opacity:.65;font-size:12px}
.bar .t{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.bar button{border:0;background:none;color:inherit;opacity:.6;font-size:15px;padding:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lg{display:flex;align-items:center;gap:10px}.lg img{width:40px;height:40px;border-radius:50%;display:block}
.stp{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);font-size:11px;font-weight:600;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:none}
.stp i{width:6px;height:6px;border-radius:50%;background:var(--off)}.stp.s-in i{background:var(--ok)}.stp.s-st i{background:var(--warn)}
.info{border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;flex:1;width:100%}
.gal{position:relative;border-radius:14px;overflow:hidden;background:var(--tile);margin-bottom:10px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.sl{flex:none;width:100%;aspect-ratio:1;scroll-snap-align:center;object-fit:cover;display:block}
.ph{display:grid;place-items:center;color:var(--muted)}
.ph svg{height:auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mGal .sl{aspect-ratio:4/3}
.gb{display:none;position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2);place-items:center;font-size:18px;line-height:1;color:#111}
.gb.l{left:6px}.gb.r{right:6px}
@media(hover:hover){.gal:hover .gb{display:grid}}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.2)}.dots i.on{background:rgba(0,0,0,.65)}
.months{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;display:none}
.toast.on{display:block}
</style>
</head>

];
// Условия рассрочки: срок (мес), наценка %, метка (необязательно)
let PLANS=[{id:1,m:3,pct:0,label:""},{id:2,m:6,pct:8,label:""},{id:3,m:12,pct:16,label:""},{id:4,m:24,pct:32,label:""},{id:5,m:24,pct:0,label:"0·0·24"}];
let ORD=[
 {item:"MacBook Air 13 M3 (16/512, Midnight)",who:"Алишер · +7 701 ··· 44 12",terms:"Рассрочка 12 мес",sum:742400,s:0},
 {item:"Dyson Airwrap (Complete Long)",who:"Дана · +7 707 ··· 89 01",terms:"Сразу",sum:283000,s:1},
 {item:"iPad Air M2 (256 ГБ Wi-Fi, Blue)",who:"Тимур · +7 777 ··· 19 55",terms:"Рассрочка 6 мес",sum:379000,s:2}];
let MIN=450,MAX=520,raw=480,RATE=480,lastA=Date.now();
try{const S=JSON.parse(localStorage.getItem(KEY)||"null");if(S&&S.P)({P,PLANS,ORD,MIN,MAX,raw,RATE,lastA}=S)}catch(e){}
const ST={in:["В магазине","В наличии в магазине","s-in"],st:["На складе","На складе, привезём завтра","s-st"],so:["Ожидается","Ожидается поставка","s-so"]};
let f="Все",onlyIn=true,cur,vi=0,ci=0,mode="inst",pid=3,booking,timer;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex=c=>/^#[0-9a-f]{3,8}$/i.test(c)?c:"#ccc";
const fmt=n=>Math.round(n).toLocaleString("ru-RU")+" ₸";
const kzt=usd=>Math.round(usd*RATE/1000)*1000;
const inst=(p,pl)=>{const t=Math.round(p*(1+pl.pct/100)/100)*100;return{t,m:Math.round(t/pl.m/100)*100,over:Math.max(0,Math.round(p*(pl.pct/100)/100)*100)}};
const cats=()=>[...new Set([...ORDER.filter(c=>P.some(p=>p.cat===c&&(!onlyIn||p.st!=="so"))),...P.filter(p=>!onlyIn||p.st!=="so").map(p=>p.cat)])];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({P,PLANS,ORD,MIN,MAX,raw,RATE,lastA}))}catch(e){toast("Не удалось сохранить: слишком много фото")}};
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2500)}
function waLink(text){return`https://wa.me/${PHONE}?text=${encodeURIComponent(text||"Здравствуйте! Хочу уточнить по товару.")}`}
function setupContacts(){
  const c=document.querySelector(".contacts");
  if(c){c.querySelector("b").textContent=ADDRESS;c.querySelector("span").textContent=HOURS}
  $("write").href=waLink("Здравствуйте! Пишу с сайта SAMSTORE.KZ.");
}
// ===== Курс: обновляется раз в час =====
const hs=t=>{const d=new Date(t);d.setMinutes(0,0,0);return+d};
const tm=t=>new Date(t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const clamp=r=>Math.min(MAX,Math.max(MIN,r));
function applyRate(){RATE=clamp(raw);lastA=Date.now();save();render();rateTxt();if($("modal").classList.contains("open"))opts()}
function hourly(){if(hs(Date.now())>hs(lastA))applyRate()}
function rateTxt(){$("rate").innerHTML=`<span class="dot"></span>1 $ = ${RATE} ₸ · обновлён в ${tm(lastA)}`}
// ===== Галерея =====
const SH=["#f5f5f7","#eeeef1","#f8f8fa"],SZ=[38,50,26];
function imgsFor(p,colorIdx){
  if(!(p.imgs&&p.imgs.length))return[];
  const list=[...p.imgs];
  if(colorIdx==null||list.length<2)return list;
  const i=colorIdx%list.length;
  const [picked]=list.splice(i,1);
  return[picked,...list];
}
const slides=(p,colorIdx)=>{
  const list=imgsFor(p,colorIdx);
  if(list.length)return list.map(u=>`<img class="sl" src="${u}" alt="${esc(p.name)}" loading="lazy">`);
  return[0,1,2].map(i=>`<div class="sl ph" style="background:${SH[i]}"><svg viewBox="0 0 64 64" style="width:${SZ[i]}%">${I[p.cat]||I.Box}</svg></div>`);
};
const gal=(p,click,colorIdx)=>{const s=slides(p,click?null:colorIdx);return `<div class="gal"><div class="stp ${ST[p.st][2]}"><i></i>${ST[p.st][click?0:1]}</div><div class="slides" ${click?`onclick="openM(${p.id})"`:""}>${s.join("")}</div><button class="gb l" onclick="gs(this,-1)" aria-label="Назад">‹</button><button class="gb r" onclick="gs(this,1)" aria-label="Вперёд">›</button>${s.length>1?`<div class="dots">${s.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}</div>`};
function gs(b,d){const s=b.parentNode.querySelector(".slides");s.scrollBy({left:d*s.clientWidth,behavior:"smooth"})}
function sc(b,d){const r=b.parentNode.querySelector(".rail");r.scrollBy({left:d*r.clientWidth*.8,behavior:"smooth"})}
function arrows(){document.querySelectorAll(".rw").forEach(w=>{const r=w.querySelector(".rail");w.querySelector(".l").hidden=r.scrollLeft<8;w.querySelector(".r").hidden=r.scrollLeft+r.clientWidth>=r.scrollWidth-8})}
addEventListener("scroll",e=>{arrows();const t=e.target;if(t.classList&&t.classList.contains("slides")){const i=Math.round(t.scrollLeft/t.clientWidth);t.parentNode.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===i))}},true);
addEventListener("resize",arrows);
// ===== Каталог =====
function toggleStock(){onlyIn=!onlyIn;$("stock").classList.toggle("on",onlyIn);chips();render()}
function chips(){if(f!=="Все"&&!cats().includes(f))f="Все";
  $("chips").innerHTML=["Все",...cats()].map(c=>`<button class="chip ${c===f?"on":""}" onclick="f=this.dataset.c;chips();render()" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function render(){
  const q=$("q").value.trim().toLowerCase(),all=f==="Все";
  const ok=p=>(!onlyIn||p.st!=="so")&&p.name.toLowerCase().includes(q);
  const cd=p=>{const k=kzt(p.base),mn=Math.min(...PLANS.map(x=>inst(k,x).m));
    return `<article class="card">${gal(p,1)}<button class="info" onclick="openM(${p.id})"><div class="name">${esc(p.name)}</div><div class="cols">${p.c.map(x=>`<span class="sw" style="background:${hex(x.c)}"></span>`).join("")}</div><div class="pbox"><div class="mo">от ${fmt(mn)} <small>/ мес</small></div><div class="cash">или ${fmt(k)} сразу</div></div></button></article>`};
  let h="";
  (all?cats():[f]).forEach(c=>{const l=P.filter(p=>p.cat===c&&ok(p));if(!l.length)return;
    h+=`<section class="sec"><div class="sec-h"><h2>${esc(c)}</h2>${all?`<button class="all" data-c="${esc(c)}" onclick="f=this.dataset.c;chips();render();scrollTo(0,0)">Смотреть все</button>`:`<button class="all" onclick="f='Все';chips();render()">‹ Все категории</button>`}</div><div class="rw"><button class="ar l" hidden onclick="sc(this,-1)" aria-label="Назад">‹</button><div class="rail ${all?"":"wrap"}">${l.map(cd).join("")}</div><button class="ar r" onclick="sc(this,1)" aria-label="Вперёд">›</button></div></section>`});
  $("grid").innerHTML=h||`<div class="empty">${onlyIn?"Сейчас ничего в наличии. Снимите фильтр «В наличии».":"Ничего не нашли. Попробуйте другое название."}</div>`;
  arrows();
}
// ===== Окно товара =====
const cashP=()=>kzt(cur.base+cur.v[vi][1]);
const plan=()=>PLANS.find(x=>x.id===pid)||PLANS[0];
function openM(id){cur=P.find(p=>p.id===id);vi=ci=0;
  $("mT").textContent=cur.name;
  $("modal").classList.add("open");document.body.style.overflow="hidden";opts(true)}
function closeM(){$("modal").classList.remove("open");document.body.style.overflow=""}
function opts(refreshGal){
  $("gV").style.display=cur.v.length>1?"":"none";
  $("mV").innerHTML=cur.v.map((v,i)=>`<button class="opt ${i===vi?"on":""}" onclick="vi=${i};opts()">${esc(v[0])}</button>`).join("");
  $("gC").style.display=cur.c.length>1?"":"none";
  $("mC").innerHTML=cur.c.map((c,i)=>`<button class="opt ${i===ci?"on":""}" onclick="ci=${i};opts(1)"><span class="sw" style="background:${hex(c.c)};width:14px;height:14px"></span>${esc(c.n)}</button>`).join("");
  if(refreshGal)$("mGal").innerHTML=gal(cur,0,ci);
  const p=cashP(),pl=plan();pid=pl.id;
  $("mM").style.display=mode==="inst"?"grid":"none";
  $("mM").innerHTML=PLANS.map(x=>`<button class="opt ${x.id===pid?"on":""}" onclick="pid=${x.id};opts()">${x.m} мес<small>${x.label?esc(x.label):x.pct?"+"+x.pct+"%":"без %"}</small></button>`).join("");
  const cmp=$("mCmp");
  if(mode==="cash"){
    $("mBig").textContent=fmt(p);
    cmp.style.display="none";cmp.innerHTML="";
    $("mNote").textContent="Оплата сразу. Цена по курсу "+RATE+" ₸/$.";
  }else{
    const r=inst(p,pl);
    $("mBig").textContent=fmt(r.m)+" / мес";
    cmp.style.display="grid";
    cmp.innerHTML=`<div><span>Сейчас</span><b>${fmt(p)}</b></div><div><span>В месяц</span><b class="hi">${fmt(r.m)}</b></div><div><span>Переплата</span><b>${r.over?fmt(r.over):"0 ₸"}</b></div>`;
    $("mNote").textContent=`Итого ${fmt(r.t)} за ${pl.m} мес${pl.label?" · "+pl.label:""}.`;
  }
  const b=$("mBig");b.classList.remove("tick");void b.offsetWidth;b.classList.add("tick")}
function pay(m){mode=m;$("pC").classList.toggle("on",m==="cash");$("pI").classList.toggle("on",m==="inst");opts()}
function book(){
  const p=cashP(),pl=plan(),r=mode==="inst"?inst(p,pl):null,label=`${cur.name} (${cur.v[vi][0]}, ${cur.c[ci].n})`;
  const terms=r?`Рассрочка ${pl.m} мес${pl.label?" ("+pl.label+")":""}`:"Сразу";
  let t=`Здравствуйте! Хочу забронировать ${label}. Цена: ${fmt(p)}.`+(r?` ${terms} (${fmt(r.m)}/мес).`:"")+" Приеду в магазин через час.";
  ORD.unshift({item:label,who:"Новый клиент · с сайта",terms,sum:r?r.t:p,s:0,fresh:1});save();
  booking={end:Date.now()+HOLD*1000};$("bItem").textContent=cur.name;$("bar").classList.add("on");tick();clearInterval(timer);timer=setInterval(tick,1000);
  window.open(waLink(t),"_blank");closeM()}
function tick(){if(!booking)return;const s=Math.max(0,Math.round((booking.end-Date.now())/1000));
  $("bTime").textContent=`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;if(!s)cancelB()}
function cancelB(){booking=null;clearInterval(timer);$("bar").classList.remove("on")}
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

setInterval(hourly,30000);
setupContacts();hourly();chips();render();rateTxt();

</script>
